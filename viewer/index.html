<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UE CodeGraph</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --text: #1f2328; --muted: #656d76;
    --border: #d0d7de; --accent: #0969da; --accent-soft: #ddf4ff; --good: #1a7f37; --warn: #9a6700; --bad: #cf222e;
    --edge: rgba(101,109,118,.45); --edge-hi: #0969da; --label-bg: rgba(255,255,255,.88);
    --shadow: 0 1px 2px rgba(31,35,40,.08), 0 4px 14px rgba(31,35,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --panel: #151b23; --panel2: #1c232d; --text: #e6edf3; --muted: #8d99a6;
      --border: #2a3441; --accent: #58a6ff; --accent-soft: #12263f; --good: #3fb950; --warn: #d29922; --bad: #f85149;
      --edge: rgba(141,153,166,.4); --edge-hi: #58a6ff; --label-bg: rgba(13,17,23,.85);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --panel: #151b23; --panel2: #1c232d; --text: #e6edf3; --muted: #8d99a6;
    --border: #2a3441; --accent: #58a6ff; --accent-soft: #12263f; --good: #3fb950; --warn: #d29922; --bad: #f85149;
    --edge: rgba(141,153,166,.4); --edge-hi: #58a6ff; --label-bg: rgba(13,17,23,.85);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input, select { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .brand { font-weight: 650; letter-spacing: .1px; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 20px; height: 20px; }
  .spacer { flex: 1; }
  .live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .dot.pulse { animation: pulse 1.2s ease-out; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--good); } 100% { box-shadow: 0 0 0 10px transparent; } }
  @media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }

  nav { display: flex; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab {
    padding: 9px 14px; border: 0; border-bottom: 2px solid transparent; background: none; border-radius: 0;
    color: var(--muted); white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg); }
  .toolbar label { color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .searchbox { position: relative; flex: 1 1 260px; max-width: 460px; }
  .searchbox input { width: 100%; }
  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); max-height: 340px; overflow: auto;
  }
  .results div { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .results div[aria-selected="true"], .results div:hover { background: var(--accent-soft); }
  .results small { color: var(--muted); margin-left: auto; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .chip { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 11.5px; line-height: 18px; background: var(--panel2); border: 1px solid var(--border); }
  .chip.ue { background: color-mix(in srgb, #a066e8 18%, transparent); border-color: color-mix(in srgb, #a066e8 50%, transparent); }
  .chip.bp { background: color-mix(in srgb, #2da44e 18%, transparent); border-color: color-mix(in srgb, #2da44e 50%, transparent); }

  main { flex: 1; min-height: 0; display: flex; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.pointer { cursor: pointer; }
  aside {
    width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--border); overflow: auto; padding: 14px 16px;
  }
  aside h2 { font-size: 15px; margin: 0 0 2px; word-break: break-word; }
  aside h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  aside .sub { color: var(--muted); font-size: 12.5px; word-break: break-all; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: 3px 0; display: flex; gap: 6px; align-items: baseline; }
  aside a, .link { color: var(--accent); cursor: pointer; text-decoration: none; background: none; border: 0; padding: 0; text-align: left; }
  aside a:hover, .link:hover { text-decoration: underline; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  .overlay { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  .note { position: absolute; right: 12px; top: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 70%; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; }
  .toast { position: fixed; right: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--good); padding: 8px 12px; border-radius: 8px; box-shadow: var(--shadow); z-index: 50; font-size: 13px; }

  /* overview */
  #overview { position: absolute; inset: 0; overflow: auto; padding: 18px 20px 40px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .l { color: var(--muted); font-size: 12.5px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .box h3 { margin: 0 0 10px; font-size: 13px; }
  .bar { display: grid; grid-template-columns: minmax(80px, 150px) 1fr 64px; gap: 8px; align-items: center; padding: 2px 0; font-size: 12.5px; }
  .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar.btn { cursor: pointer; border-radius: 4px; }
  .bar.btn:hover { background: var(--accent-soft); }
  .health { display: grid; gap: 10px; }
  .health .fill.good { background: var(--good); } .health .fill.warn { background: var(--warn); } .health .fill.bad { background: var(--bad); }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    aside { width: auto; max-height: 38%; border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7 7.2l3.6 8.6M17 7.2l-3.6 8.6M7.5 6h9"/></svg>
    UE CodeGraph
  </div>
  <label class="hint">Codebase <select id="cb" aria-label="Codebase"></select></label>
  <div class="spacer"></div>
  <div class="live" id="live"><span class="dot" id="dot"></span><span id="liveText">live</span></div>
  <button id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
</header>

<nav role="tablist" id="tabs">
  <button class="tab" role="tab" data-tab="overview">Overview</button>
  <button class="tab" role="tab" data-tab="classes">Class hierarchy</button>
  <button class="tab" role="tab" data-tab="calls">Call graph</button>
  <button class="tab" role="tab" data-tab="includes">Includes</button>
  <button class="tab" role="tab" data-tab="modules">Modules</button>
</nav>

<div class="toolbar" id="toolbar">
  <div class="searchbox" id="searchWrap">
    <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search" placeholder="Search…">
    <div class="results" id="results" role="listbox" hidden></div>
  </div>
  <label id="dirWrap">Direction
    <select id="dir"><option value="both">both</option><option value="up">up</option><option value="down">down</option></select>
  </label>
  <label id="depthWrap">Depth
    <select id="depth"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
  </label>
  <label id="modDepthWrap">Folder depth
    <select id="modDepth"><option value="0" selected>auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
  </label>
  <label id="minWrap">Min includes
    <select id="minEdge"><option>1</option><option>3</option><option>5</option><option>10</option><option>25</option></select>
  </label>
  <button id="backBtn" disabled>← Back</button>
  <button id="fitBtn">Fit</button>
  <span class="hint" id="toolHint"></span>
</div>

<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overview" hidden></div>
    <div class="note" id="note" hidden></div>
    <div class="empty" id="empty" hidden></div>
    <div class="overlay" id="overlay"><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomOut" aria-label="Zoom out">－</button></div>
  </div>
  <aside id="side" aria-live="polite"></aside>
</main>

<script>
'use strict';
/* ------------------------------------------------------------------ helpers */
const $ = (id) => document.getElementById(id);
const api = async (path, params = {}) => {
  const u = new URL(path, location.href);
  for (const [k, v] of Object.entries(params)) if (v !== null && v !== undefined && v !== '') u.searchParams.set(k, v);
  const r = await fetch(u);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const fmt = (n) => (n ?? 0).toLocaleString();
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const hueOf = (s) => { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; };
const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === 'dark'
  : matchMedia('(prefers-color-scheme: dark)').matches;
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const KIND_COLOR = {
  class: '#4f8cff', struct: '#16a394', interface: '#a066e8', function: '#f2994a', method: '#e8a33d',
  constructor: '#d9822b', destructor: '#d9822b', file: '#7d8da1', module: '#4f8cff', ghost: '#8d99a6',
};
function nodeColor(n) {
  if (n.ghost) return KIND_COLOR.ghost;
  if (n.kind === 'file' || n.kind === 'module') {
    const h = hueOf(n.group || n.id);
    return isDark() ? `hsl(${h} 55% 62%)` : `hsl(${h} 55% 44%)`;
  }
  return KIND_COLOR[n.kind] || KIND_COLOR.file;
}

/* ------------------------------------------------------------------ graph view */
class GraphView {
  constructor(canvas, cb) {
    this.cv = canvas; this.ctx = canvas.getContext('2d'); this.cb = cb;
    this.nodes = []; this.edges = []; this.byId = new Map();
    this.view = { x: 0, y: 0, k: 1 };
    this.alpha = 0; this.layered = false; this.autoFit = false; this.raf = 0;
    this.hover = null; this.selected = null; this.drag = null;
    this.colors = {};
    this.refreshColors();
    new ResizeObserver(() => { this.resize(); this.draw(); }).observe(canvas.parentElement);
    canvas.addEventListener('pointerdown', (e) => this.down(e));
    canvas.addEventListener('pointermove', (e) => this.move(e));
    canvas.addEventListener('pointerup', (e) => this.up(e));
    canvas.addEventListener('pointerleave', () => { if (!this.drag) { this.hover = null; this.draw(); } });
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); this.zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
    canvas.addEventListener('dblclick', (e) => { const n = this.pick(e.offsetX, e.offsetY); if (n) this.cb.onOpen(n); });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { this.refreshColors(); this.draw(); });
    this.resize();
  }
  refreshColors() {
    this.colors = { edge: cssVar('--edge'), edgeHi: cssVar('--edge-hi'), text: cssVar('--text'), muted: cssVar('--muted'), labelBg: cssVar('--label-bg'), bg: cssVar('--bg') };
  }
  resize() {
    const r = this.cv.parentElement.getBoundingClientRect(); const d = window.devicePixelRatio || 1;
    this.w = r.width; this.h = r.height;
    this.cv.width = Math.max(1, Math.round(r.width * d)); this.cv.height = Math.max(1, Math.round(r.height * d));
    this.ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  setGraph(g, { layered = false } = {}) {
    const old = this.byId;
    this.layered = layered;
    const LH = 120;
    this.nodes = g.nodes.map((n, i) => {
      const prev = old.get(n.id);
      const a = (i / Math.max(1, g.nodes.length)) * Math.PI * 2;
      const rad = 60 + Math.sqrt(g.nodes.length) * 18;
      return Object.assign({}, n, {
        x: prev ? prev.x : Math.cos(a) * rad + (Math.random() - .5) * 20,
        y: prev ? prev.y : (layered ? (n.level || 0) * LH : Math.sin(a) * rad),
        vx: 0, vy: 0, r: nodeRadius(n), fixed: false, _fresh: !prev,
      });
    });
    this.byId = new Map(this.nodes.map((n) => [n.id, n]));
    this.edges = g.edges.map((e) => ({ a: this.byId.get(e.from), b: this.byId.get(e.to), w: e.weight || 1 })).filter((e) => e.a && e.b);
    this.adj = new Map(this.nodes.map((n) => [n.id, new Set()]));
    for (const e of this.edges) { this.adj.get(e.a.id).add(e.b.id); this.adj.get(e.b.id).add(e.a.id); }
    this.LH = LH;
    this.selected = this.selected && this.byId.get(this.selected.id) || null;
    const fresh = this.nodes.every((n) => n._fresh);
    this.autoFit = false;
    if (fresh && this.nodes.length) {
      // settle off-screen first so the graph appears already laid out, then snap the camera onto it
      this.alpha = 1;
      const warm = this.nodes.length > 250 ? 60 : 120;
      for (let i = 0; i < warm; i++) { this.step(); this.alpha *= 0.97; }
      this.fit(false, true);
      this.alpha = 0.25;
    } else this.alpha = 0.5;
    this.kick();
    this.draw();
  }
  kick() { if (!this.raf) this.raf = requestAnimationFrame(() => this.frame()); }
  frame() {
    this.raf = 0;
    if (this.alpha > 0.015) {
      const steps = this.nodes.length > 250 ? 1 : 2;
      for (let i = 0; i < steps; i++) this.step();
      this.alpha *= 0.975;
    }
    this.draw();
    if (this.alpha > 0.015 || this.drag) this.kick();
  }
  step() {
    const N = this.nodes, a = this.alpha;
    for (let i = 0; i < N.length; i++) {
      const p = N[i];
      for (let j = i + 1; j < N.length; j++) {
        const q = N[j];
        let dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
        if (d2 > 160000) continue;
        if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
        const d = Math.sqrt(d2), minD = p.r + q.r + 26;
        let f = (2600 / d2) * a; if (d < minD) f += (minD - d) * 0.08;
        dx = (dx / d) * f; dy = (dy / d) * f;
        p.vx += dx; p.vy += dy; q.vx -= dx; q.vy -= dy;
      }
    }
    for (const e of this.edges) {
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const target = 70 + e.a.r + e.b.r;
      const f = (d - target) * 0.02 * a, fx = (dx / d) * f, fy = (dy / d) * f;
      e.a.vx += fx; e.a.vy += fy; e.b.vx -= fx; e.b.vy -= fy;
    }
    for (const n of N) {
      if (this.layered) n.vy += ((n.level || 0) * this.LH - n.y) * 0.06 * a + ((n.level || 0) * this.LH - n.y) * 0.004;
      n.vx += -n.x * 0.004 * a; if (!this.layered) n.vy += -n.y * 0.004 * a;
      if (n.fixed) { n.vx = n.vy = 0; continue; }
      n.vx *= 0.8; n.vy *= 0.8;
      n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy));
    }
  }
  fit(animate, snap = false) {
    if (!this.nodes.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of this.nodes) { x0 = Math.min(x0, n.x - n.r - 30); x1 = Math.max(x1, n.x + n.r + 30); y0 = Math.min(y0, n.y - n.r - 20); y1 = Math.max(y1, n.y + n.r + 30); }
    const k = Math.min(2, Math.max(0.12, Math.min(this.w / (x1 - x0), this.h / (y1 - y0)) * 0.94));
    const tx = this.w / 2 - ((x0 + x1) / 2) * k, ty = this.h / 2 - ((y0 + y1) / 2) * k;
    const v = this.view, t = snap ? 1 : animate ? 0.25 : 0.12;
    v.k += (k - v.k) * t; v.x += (tx - v.x) * t; v.y += (ty - v.y) * t;
  }
  toWorld(sx, sy) { return { x: (sx - this.view.x) / this.view.k, y: (sy - this.view.y) / this.view.k }; }
  zoomAt(sx, sy, f) {
    const v = this.view, k = Math.min(4, Math.max(0.08, v.k * f)), w = this.toWorld(sx, sy);
    v.k = k; v.x = sx - w.x * k; v.y = sy - w.y * k; this.autoFit = false; this.draw();
  }
  pick(sx, sy) {
    const w = this.toWorld(sx, sy);
    for (let i = this.nodes.length - 1; i >= 0; i--) {
      const n = this.nodes[i], dx = n.x - w.x, dy = n.y - w.y, r = n.r + 4 / this.view.k;
      if (dx * dx + dy * dy <= r * r) return n;
    }
    return null;
  }
  down(e) {
    this.cv.setPointerCapture(e.pointerId);
    const n = this.pick(e.offsetX, e.offsetY);
    this.drag = { node: n, sx: e.offsetX, sy: e.offsetY, moved: false, vx: this.view.x, vy: this.view.y };
    this.autoFit = false;
    if (n) { n.fixed = true; this.alpha = Math.max(this.alpha, 0.35); this.kick(); }
    this.cv.classList.add('dragging');
  }
  move(e) {
    const d = this.drag;
    if (d) {
      const dx = e.offsetX - d.sx, dy = e.offsetY - d.sy;
      if (Math.abs(dx) + Math.abs(dy) > 3) d.moved = true;
      if (d.node) { const w = this.toWorld(e.offsetX, e.offsetY); d.node.x = w.x; d.node.y = w.y; }
      else { this.view.x = d.vx + dx; this.view.y = d.vy + dy; }
      this.draw();
      return;
    }
    const n = this.pick(e.offsetX, e.offsetY);
    if (n !== this.hover) {
      this.hover = n; this.cv.classList.toggle('pointer', !!n); this.cb.onHover(n, e); this.draw();
    }
  }
  up(e) {
    const d = this.drag; this.drag = null; this.cv.classList.remove('dragging');
    if (!d) return;
    if (d.node) d.node.fixed = false;

      el('div', { class: 'box' }, el('h3', {}, 'Folders by symbol count (click → dependencies)'), bars(o.directories.slice(0, 14), { key: 'symbols', onClick: () => setTab('modules') })),
      el('div', { class: 'box' }, el('h3', {}, 'Largest classes (members)'), bars(o.biggestClasses, { key: 'members', onClick: (r) => { S.tab = 'classes'; setTab('classes'); go(r.name); } })),
      el('div', { class: 'box' }, el('h3', {}, 'Most called functions'), bars(o.mostCalled, { name: (r) => r.qname, onClick: (r) => { setTab('calls'); go(r.name, r.id); } })),
      el('div', { class: 'box' }, el('h3', {}, 'Most included headers'), bars(o.mostIncluded, { name: (r) => r.file.split(/[\\/]/).pop(), onClick: (r) => { setTab('includes'); go(r.file, r.id); } }))));
  $('overview').replaceChildren(root);
}

/* ------------------------------------------------------------------ boot + live updates */
async function boot() {
  S.codebases = await api('api/codebases');
  const sel = $('cb');
  if (!S.codebases.length) {
    sel.replaceChildren();
    $('overview').hidden = false; $('cv').hidden = true; $('overlay').hidden = true;
    $('overview').replaceChildren(el('div', { class: 'box' }, el('h3', {}, 'Nothing indexed yet'),
      el('p', {}, 'Index a project first:'), el('pre', { class: 'mono' }, 'ue-graph index "C:\\path\\to\\YourProject\\Source" my-project')));
    return;
  }
  loadHash();
  if (!S.codebases.some((c) => c.id === S.cb)) S.cb = S.codebases[0].id;
  sel.replaceChildren(...S.codebases.map((c) => el('option', { value: c.id }, `${c.name} (${fmt(c.symbols)} symbols)`)));
  sel.value = S.cb;
  sel.addEventListener('change', () => { S.cb = Number(sel.value); S.history = []; setTab(S.tab); pollVersion(true); });
  const t = S.tab, r = S.root, rid = S.rootId;
  S.root = r; S.rootId = rid;
  setTab(t, { keepRoot: true });
  if (r) $('q').value = r;
  pollVersion(true);
  setInterval(() => pollVersion(false), 2500);
}
async function pollVersion(silent) {
  try {
    const v = await api('api/version', { cb: S.cb });
    $('liveText').textContent = 'live';
    $('dot').style.background = 'var(--good)';
    if (S.version && S.version !== v.token && !silent) {
      $('dot').classList.remove('pulse'); void $('dot').offsetWidth; $('dot').classList.add('pulse');
      toast('Index updated — refreshing');
      S.codebases = await api('api/codebases');
      refresh();
    }
    S.version = v.token;
  } catch {
    $('liveText').textContent = 'offline'; $('dot').style.background = 'var(--bad)';
  }
}
boot().catch((e) => { $('overview').hidden = false; $('overview').replaceChildren(el('div', { class: 'box' }, 'Failed to load: ' + e.message)); });
</script>

    'Zoom in': '확대', 'Zoom out': '축소', 'Codebase ': '코드베이스',
    'Search a class. Double-click a node to re-center on it.': '클래스를 검색하세요. 노드를 더블클릭하면 그 노드가 중심이 됩니다.',
    'Search a function. Arrows point caller → callee.': '함수를 검색하세요. 화살표는 호출하는 쪽 → 호출되는 쪽입니다.',
    'Search a file. Arrows point includer → included header.': '파일을 검색하세요. 화살표는 include 하는 파일 → include 되는 헤더입니다.',
    'Folder-level #include dependencies. Node size ≈ symbols.': '폴더 단위 #include 의존성. 화살표: include 하는 폴더 → include 되는 폴더. 노드 크기 ≈ 심볼 수.',
    'Class name, e.g. AActor': '클래스 이름 (예: AActor)', 'Function name, e.g. BeginPlay': '함수 이름 (예: BeginPlay)', 'File name, e.g. Actor.h': '파일 이름 (예: Actor.h)',

    'Search for a function to see who calls it and what it calls.': '함수를 검색하면 호출하는 곳과 호출되는 곳을 볼 수 있습니다.',
    'Search for a source file to see its #include neighbourhood.': '소스 파일을 검색하면 #include 관계를 볼 수 있습니다.',
    'Nothing to show. Try a different name or a lower "Min includes".': '표시할 내용이 없습니다. 다른 이름을 입력하거나 "최소 include 수"를 낮춰 보세요.',
    'Index updated — refreshing': '인덱스가 갱신되어 새로고침합니다', 'Path copied': '경로를 복사했습니다',
    'Index overview': '인덱스 개요', 'Click an entry to jump to its graph.': '항목을 클릭하면 해당 그래프로 이동합니다.',

    'Signature': '시그니처', 'Parameters': '매개변수', 'Calls': '호출', 'Member of': '소속 클래스', 'Base classes': '부모 클래스',
    'Symbols': '심볼', 'Copy path': '경로 복사', 'Include graph': 'include 그래프', 'system': '시스템',

    'Link quality': '연결 품질', 'Calls resolved to a symbol': '심볼로 연결된 호출', 'Includes resolved to a file': '파일로 연결된 include',
    'Base classes resolved': '연결된 부모 클래스',
    'Unresolved calls usually target engine code that is not indexed': '연결되지 않은 호출은 대부분 인덱싱되지 않은 엔진 코드를 가리킵니다',
    'Engine / third-party headers are not indexed, so a share of includes always stays unresolved (*.generated.h excluded)': '엔진·외부 헤더는 인덱싱되지 않아 일부 include는 항상 연결되지 않습니다 (*.generated.h 제외)',
    'Unresolved bases are typically engine classes (AActor, UObject…)': '연결되지 않은 부모 클래스는 대개 엔진 클래스입니다 (AActor, UObject…)',
    'Symbols by kind': '종류별 심볼', 'No UE macros found.': 'UE 매크로가 없습니다.',
    'Folders by symbol count (click → dependencies)': '폴더별 심볼 수 (클릭 → 의존성)',
    'Largest classes (members)': '멤버가 많은 클래스', 'Most called functions': '가장 많이 호출된 함수', 'Most included headers': '가장 많이 include 된 헤더',
    'Nothing indexed yet': '아직 인덱싱된 것이 없습니다', 'Index a project first:': '먼저 프로젝트를 인덱싱하세요:',
    // 심볼 종류 / 매크로 종류
    'class': '클래스', 'struct': '구조체', 'interface': '인터페이스', 'function': '함수', 'method': '메서드', 'constructor': '생성자',
    'destructor': '소멸자', 'field': '필드', 'variable': '변수', 'enum': '열거형', 'typedef': '타입 별칭', 'namespace': '네임스페이스', 'file': '파일',
  };
  const P = [
    [/^(\d[\d,]*) nodes · (\d[\d,]*) edges(.*)$/, (m) => `노드 ${m[1]}개 · 연결 ${m[2]}개` + m[3]
      .replace(' · folder depth ', ' · 폴더 깊이 ').replace(' · truncated — reduce depth', ' · 일부 생략됨 — 깊이를 줄이세요')],
    [/^(.+) is not indexed$/, (m) => `${m[1]} 은(는) 인덱싱되지 않았습니다`],
    [/^(\d[\d,]*) caller\(s\) · (\d[\d,]*) callee\(s\)$/, (m) => `호출하는 곳 ${m[1]}개 · 호출되는 곳 ${m[2]}개`],
    [/^(\d[\d,]*) file\(s\) include this · (\d[\d,]*) #include\(s\)$/, (m) => `이 파일을 include 하는 파일 ${m[1]}개 · 이 파일의 #include ${m[2]}개`],
    [/^Derived \((.+)\)$/, (m) => `파생 클래스 (${m[1]})`],
    [/^Methods \((.+)\)$/, (m) => `메서드 (${m[1]})`],
    [/^Fields \((.+)\)$/, (m) => `필드 (${m[1]})`],
    [/^([\d,]+) of ([\d,]+)$/, (m) => `${m[2]} 중 ${m[1]}`],
    [/^Error: (.*)$/, (m) => `오류: ${m[1]}`],
    [/^Failed to load: (.*)$/, (m) => `불러오기 실패: ${m[1]}`],
    [/^(.+) \((\d[\d,]*) symbols\)$/, (m) => `${m[1]} (심볼 ${m[2]}개)`],
  ];
  const tr = (s) => {
    const t = s.trim(); if (!t) return s;
    let out = D[t];
    if (out === undefined) for (const [re, f] of P) { const m = t.match(re); if (m) { out = f(m); break; } }
    return out === undefined ? s : s.replace(t, out);
  };
  const ATTRS = ['placeholder', 'title', 'aria-label'];
  const walk = (root) => {
    if (root.nodeType === 3) { const v = tr(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; return; }
    if (root.nodeType !== 1 || /^(SCRIPT|STYLE|CODE|PRE|CANVAS)$/.test(root.tagName)) return;
    for (const a of ATTRS) if (root.hasAttribute(a)) { const v = tr(root.getAttribute(a)); if (v !== root.getAttribute(a)) root.setAttribute(a, v); }
    for (const c of root.childNodes) walk(c);
  };
  document.documentElement.lang = 'ko';
  walk(document.body);
  new MutationObserver((muts) => {
    for (const m of muts) {
      if (m.type === 'attributes') walk(m.target);
      else if (m.type === 'characterData') walk(m.target);
      else m.addedNodes.forEach(walk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
})();
